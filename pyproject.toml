[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jcba-receiver"
version = "0.1.0"
description = "A polished local web receiver for JCBA Internet Simulradio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "uvicorn[standard]>=0.34",
  "websockets>=14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
]

[project.scripts]
jcba-receiver = "jcba_receiver.main:run"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jcba_receiver"]

[tool.ruff]
line-length = 100

target-version = "py311"
